name: Actualizar series diarias

on:
  schedule:
    - cron: "0 12 * * 1-5"   # 9 AM Argentina, dias habiles
  workflow_dispatch:         # boton para correrlo a mano

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas openpyxl requests
      - run: python motor.py
      - uses: actions/upload-artifact@v4
        with:
          name: maestro
          path: salidas/
      - name: Guardar el maestro en el repo
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f salidas/MAESTRO.xlsx
          git commit -m "Actualizacion automatica" || echo "sin cambios"
          git push
